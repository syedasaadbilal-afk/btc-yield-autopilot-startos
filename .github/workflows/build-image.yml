name: Build and push image

# Builds the app's Docker image (the same Dockerfile used for local podman
# deploys) and pushes it to GHCR, multi-arch, so startos/manifest/index.ts's
# dockerTag has something real to reference. This is intentionally a plain
# docker/build-push-action workflow rather than start9labs' shared
# build.yml (which builds the .s9pk itself, not a docker image, and its
# internals aren't visible from here) - keeps this fully transparent and
# debuggable without needing to reverse-engineer someone else's workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "startos/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/btc-yield-autopilot-startos

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
